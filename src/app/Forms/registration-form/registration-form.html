<div class="min-h-screen flex items-center justify-center">
    <form class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg space-y-6">
        <div class="space-y-4">
            @for(field of formFields; track field.key){
                <input [type]="field.type" [placeholder]="field.placeholder" [field]="registrationForm[field.key]" class="w-full px-4 py-2 border border-gray-300 rounded-lg
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500 transition">
            }
        </div>

        <button (click)="onRegister($event)" [disabled]="!isFormValid()" class="w-full bg-blue-600 text-white py-2 rounded-lg
             font-medium hover:bg-blue-700 transition
             disabled:bg-gray-400 disabled:cursor-not-allowed">Register</button>
    </form>
</div>
