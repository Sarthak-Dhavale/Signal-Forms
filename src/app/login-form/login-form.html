<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <form (submit)="onSubmit($event)" class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg space-y-6">
        <div class="space-y-4">
            @for(field of loginFields; track field.key){
            <input [type]="field.type" [placeholder]="field.placeholder" [field]="loginForm[field.key]" class="w-full px-4 py-2 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:border-blue-500 transition">
            }
        </div>
        <button type="submit" class="w-full py-2 rounded-lg font-medium
         bg-blue-600 text-white
         disabled:bg-gray-400 disabled:cursor-not-allowed
         hover:bg-blue-700 transition" [disabled]="!isFormValid()">Login
        </button>
        <span (click)="goToRegistration()" class="text-blue-600 flex items-center justify-center hover:underline cursor-pointer font-medium">Register</span>
    </form>
</div>
